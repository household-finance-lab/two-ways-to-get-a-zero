<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1270" width="1120" height="1270" role="img" aria-labelledby="t d">
<title id="t">HFL Project 1 ETL pipeline: from FINRA NFCS data to open, reproducible research</title>
<desc id="d">Seven stages. Source data (FINRA NFCS 2024 Investor and State-by-State surveys) feeds 01_build.do, which merges, validates and freezes the analytic sample; 02_analyze.do runs the survey-weighted inference in Stata. The handoff to Python is output/nfcs_p1_built_analytic.csv, a gitignored respondent-level export of 2,797 rows. Three Python scripts (03_nested_prediction, 04_symmetric_comparison, 05_nonquiz_dk_sensitivity) produce aggregate result tables, which feed the Empirically Yours write-up. Supporting documentation and infrastructure files are listed below.</desc>
